const PG={
about:[['عن المنصة','About the platform'],
['منصة التطوع الليبية مبادرة مجتمعية تجمع الجمعيات والشركات والمبادرات والمتطوعين في مكان واحد، لتسهيل الوصول إلى فرص التطوع والخدمات المجتمعية في مختلف المدن الليبية.','The Libyan Volunteer Platform is a community initiative that brings associations, companies, initiatives and volunteers together, making volunteering opportunities and community services easier to find across Libya.'],
['#ماذا تقدم المنصة','#What the platform offers'],
['دليل للجهات حسب المجال والمدينة، وصفحة شخصية للمتطوع تُشارَك برابط، وإمكانية إضافة جهة أو مبادرة، وطلب خدمة اجتماعية، مع مراجعة الجهات والمبادرات قبل ظهورها.','A directory of organizations by field and city, a shareable personal volunteer page, the option to add an organization or initiative, and service requests, with organizations and initiatives reviewed before they appear.'],
['#التواصل','#Contact']],
priv:[['سياسة الخصوصية','Privacy policy'],
['#البيانات التي نجمعها','#Data we collect'],
['الاسم والمدينة ووسيلة التواصل وتفاصيل الطلب عند تقديم طلب خدمة أو طلب تطوع؛ وبيانات الجهة أو المبادرة وصورها عند إضافتها؛ ونص البلاغات؛ وبيانات صفحة المتطوع التي تدخلها بنفسك.','Your name, city, contact details and request details when you submit a service or volunteer request; organization or initiative details and photos when you add them; report text; and the volunteer-page details you enter yourself.'],
['#كيف نستخدمها','#How we use it'],
['نستخدم بياناتك للتواصل معك بخصوص طلبك، ولإدارة الدليل ومراجعته، ولمعالجة البلاغات. لا نبيع بياناتك ولا نعرض طلبات الخدمة أو أرقام التواصل علناً.','We use your data to contact you about your request, to run and review the directory, and to handle reports. We do not sell your data, and service requests and contact details are not shown publicly.'],
['#من يرى بياناتك','#Who can see it'],
['طلبات الخدمة والتطوع والبلاغات يراها مشرفو المنصة فقط. الجهات والمبادرات المعتمدة تظهر للجميع، بما فيها ما تكتبه في وصفها من وسائل تواصل. صفحة المتطوع تحمل بياناتها داخل الرابط، فكل من يملك الرابط يرى محتواها.','Service requests, volunteer requests and reports are visible only to platform admins. Approved organizations and initiatives are public, including any contact details in their description. A volunteer page carries its data inside the link, so anyone with the link can see it.'],
['#حقوقك','#Your rights'],
