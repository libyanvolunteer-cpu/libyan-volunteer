return `<div class="wrap col"><h1>${t('adm')}</h1><h2>${t('pnd')} (${PN.length})</h2>${lst(PN,x=>`<div class="card row"><div class="ic">${okp(x.lg)?`<img src="${x.lg}" alt="">`:E((x.n||'?').charAt(0))}</div><div class="g"><b>${E(x.n)}</b><span class="mu">${nm(F,x.f)} — ${nm(C,x.c)} · ${t(x.ty=='a'?'assoc':'comp')}${x.ct?' · '+E(x.ct):''}</span></div><button class="btn p" data-act="ap" data-id="${E(x._id)}">${t('ap')}</button><button class="btn s" data-act="rj" data-id="${E(x._id)}">${t('rj')}</button></div>`)}<h2>${t('pni')} (${PI.length})</h2>${lst(PI,x=>`<div class="card row"><div class="g"><b>${E(x.n)}</b><span class="mu">${nm(F,x.f)} — ${nm(C,x.c)} · ${E(x.d)}</span><span>${E(x.b)}</span></div><button class="btn p" data-act="api" data-id="${E(x._id)}">${t('ap')}</button><button class="btn s" data-act="dr" data-c="pini" data-id="${E(x._id)}">${t('rj')}</button></div>`)}<h2>${t('rqs')} (${RQ.length})</h2>${lst(RQ,x=>`<div class="card row"><div class="g"><b>#${E(x._id)} · ${E(x.n)}</b><span class="mu">${nm(C,x.c)} · ${nm(F,x.t)} · ${E(x.k)}</span><span>${E(x.d)}</span></div>${dl('reqs',x)}</div>`)}<h2>${t('jns')} (${JN.length})</h2>${lst(JN,x=>`<div class="card row"><div class="g"><b>${E(x.n)}</b><span class="mu">${E(x.o)} · ${E(x.p)}</span></div>${dl('joins',x)}</div>`)}</div>`};
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const pv=(h)=>{let p;try{p=dec(h)}catch(e){return V.home()}
return `<div class="wrap nar col"><div class="card col ctr"><div class="av">${okp(p.p)?`<img src="${p.p}" alt="">`:E((p.n||'?').charAt(0))}</div><h1>${E(p.n)}</h1><span class="mu">${nm(C,p.c)}</span><div class="row">${(p.f||[]).map(k=>`<span class="chip">${nm(F,k)}</span>`).join('')}</div><p class="mu">${E(p.b)}</p>${(p.t||p.m)?`<div class="row" style="justify-content:center">${p.t?`<a class="btn s" style="display:flex;align-items:center;text-decoration:none" dir="ltr" href="tel:${E(String(p.t).replace(/[^\d+]/g,''))}">${E(p.t)}</a>`:''}${p.m?`<a class="btn s" style="display:flex;align-items:center;text-decoration:none" dir="ltr" href="mailto:${E(p.m)}">${E(p.m)}</a>`:''}</div>`:''}</div><div class="card col"><h3>${t('link')}</h3><input class="in" id="lk" dir="ltr" readonly value="${E(location.href)}"><div class="row"><button class="btn p" data-act="copy">${t('copy')}</button><button class="btn s" data-act="fb">${t('fb')}</button><button class="btn s" data-act="ig">${t('ig')}</button><button class="btn s" data-act="wa">${t('wa')}</button></div></div><button class="btn y" data-go="/vol">${t('c3b')}</button></div>`};

const PG={
about:[['عن المنصة','About the platform'],
['منصة التطوع الليبية مبادرة مجتمعية تجمع الجمعيات والشركات والمبادرات والمتطوعين في مكان واحد، لتسهيل الوصول إلى فرص التطوع والخدمات المجتمعية في مختلف المدن الليبية.','The Libyan Volunteer Platform is a community initiative that brings associations, companies, initiatives and volunteers together, making volunteering opportunities and community services easier to find across Libya.'],
['#ماذا تقدم المنصة','#What the platform offers'],
['دليل للجهات حسب المجال والمدينة، وصفحة شخصية للمتطوع تُشارَك برابط، وإمكانية إضافة جهة أو مبادرة، وطلب خدمة اجتماعية، مع مراجعة الجهات والمبادرات قبل ظهورها.','A directory of organizations by field and city, a shareable personal volunteer page, the option to add an organization or initiative, and service requests, with organizations and initiatives reviewed before they appear.'],
['#التواصل','#Contact']],
priv:[['سياسة الخصوصية','Privacy policy'],
['#البيانات التي نجمعها','#Data we collect'],
['الاسم والمدينة ووسيلة التواصل وتفاصيل الطلب عند تقديم طلب خدمة أو طلب تطوع؛ وبيانات الجهة أو المبادرة وصورها عند إضافتها؛ ونص البلاغات؛ وبيانات صفحة المتطوع التي تدخلها بنفسك.','Your name, city, contact details and request details when you submit a service or volunteer request; organization or initiative details and photos when you add them; report text; and the volunteer-page details you enter yourself.'],
['#كيف نستخدمها','#How we use it'],
['نستخدم بياناتك للتواصل معك بخصوص طلبك، ولإدارة الدليل ومراجعته، ولمعالجة البلاغات. لا نبيع بياناتك ولا نعرض طلبات الخدمة أو أرقام التواصل علناً.','We use your data to contact you about your request, to run and review the directory, and to handle reports. We do not sell your data, and service requests and contact details are not shown publicly.'],
['#من يرى بياناتك','#Who can see it'],
['طلبات الخدمة والتطوع والبلاغات يراها مشرفو المنصة فقط. الجهات والمبادرات المعتمدة تظهر للجميع، بما فيها ما تكتبه في وصفها من وسائل تواصل. صفحة المتطوع تحمل بياناتها داخل الرابط، فكل من يملك الرابط يرى محتواها.','Service requests, volunteer requests and reports are visible only to platform admins. Approved organizations and initiatives are public, including any contact details in their description. A volunteer page carries its data inside the link, so anyone with the link can see it.'],
['#حقوقك','#Your rights'],
['يمكنك طلب تصحيح بياناتك أو حذفها في أي وقت بمراسلتنا على البريد أدناه. تجنّب كتابة معلومات حساسة في الحقول الحرة.','You can ask us to correct or delete your data at any time by emailing us below. Please avoid putting sensitive information in free-text fields.'],
['#التواصل','#Contact']],
terms:[['شروط الاستخدام','Terms of use'],
['باستخدامك المنصة فإنك توافق على هذه الشروط.','By using the platform you agree to these terms.'],
['#الاستخدام المسموح','#Acceptable use'],
['يجب أن تكون المعلومات التي تقدمها صحيحة، ويُمنع انتحال هوية جهة أو شخص، ونشر محتوى مخالف أو مضلل أو روابط ضارة، أو إرسال طلبات وهمية أو متكررة.','The information you provide must be accurate. Impersonating an organization or person, posting inappropriate or misleading content or harmful links, and sending fake or repeated requests are not allowed.'],
['#المراجعة والإزالة','#Review and removal'],
['نحتفظ بحق رفض أي جهة أو مبادرة أو إزالتها، وبحذف أي محتوى يخالف هذه الشروط دون إشعار مسبق.','We may reject or remove any organization or initiative, and delete content that breaks these terms, without prior notice.'],
['#حدود المسؤولية','#Limits of responsibility'],
['المنصة وسيط للتعريف والتواصل فقط. نحن لا نضمن دقة بيانات الجهات ولا نتحمل مسؤولية أي تعامل بينك وبين جهة أو متطوع، ويتحمل كل طرف مسؤولية مشاركته وسلامته.','The platform is only an intermediary for discovery and contact. We do not guarantee the accuracy of organization details and are not responsible for dealings between you and any organization or volunteer; each party is responsible for their own participation and safety.'],
['#الملكية الفكرية وحقوق النشر','#Intellectual property & copyright'],['جميع حقوق الملكية الفكرية للمنصة، بما في ذلك الاسم والشعار والتصميم والنصوص والشيفرة البرمجية، محفوظة لمنصة التطوع الليبية © 2026. يُمنع نسخ المنصة أو إعادة نشرها أو استخدام اسمها وشعارها دون إذن كتابي. يحتفظ أصحاب الجهات والمبادرات بحقوق محتواهم الذي ينشرونه، ويمنحون المنصة ترخيصاً غير حصري لعرضه ضمنها. لطلب الإذن أو للاستفسار عن الحقوق: libyanvolunteer@gmail.com','All intellectual property rights in the platform, including its name, logo, design, text and source code, are reserved by the Libyan Volunteer Platform © 2026. Copying, republishing, or using its name and logo without written permission is prohibited. Organizations and initiative owners retain rights to the content they submit and grant the platform a non-exclusive license to display it. For permission requests or rights inquiries: libyanvolunteer@gmail.com'],['#التعديلات','#Changes'],
['قد نحدّث هذه الشروط من وقت لآخر، واستمرارك في الاستخدام يعني قبولها.','We may update these terms from time to time; continued use means you accept them.'],
['#التواصل','#Contact']]};
